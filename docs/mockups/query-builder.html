 ['name','Item name','text','name item'],['qty','Quantity','number','quantity count stack'],['price','GE price','number','price value cost market'],['gehigh','GE high price','number','high buy'],['gelow','GE low price','number','low sell'],
 ['category','Category','text','category group'],['types','Types','text','type'],['subtype','Subtype','text','subtype'],['skills','Skills','text','skill'],['roles','Roles','text','role purpose'],['combatStyle','Combat style','text','combat style'],['armourRole','Armour role','text','armor armour role'],['slot','Equipment slot','text','equipment slot'],['weaponType','Weapon type','text','weapon'],['family','Family','text','family'],['set','Set','text','set outfit'],['form','Form','text','form'],['tier','Tier','number','tier level'],['dose','Dose','number','dose doses'],['containerType','Container type','text','container bag'],['augmentable','Augmentable','boolean','augmentable'],['augmented','Augmented','boolean','augmented'],['degradable','Degradable','boolean','degrade degradable'],['tradeable','Tradeable','boolean','tradeable tradable'],['geTradeable','GE tradeable','boolean','ge tradeable tradable'],['members','Members','boolean','member members'],['storageLocations','Storage locations','text','storage location'],['reclaimable','Reclaimable','boolean','reclaimable'],['reclaimSources','Reclaim sources','text','reclaim source diango'],['baseValue','Base value','number','base configured value']
].map(([key,label,kind,aliases])=>({key,label,kind,aliases}));
const byKey=Object.fromEntries(defs.map(f=>[f.key,f]));

const $=id=>document.getElementById(id);
const operators={text:[['phrase','has phrase'],['words','has all words']],number:[['equals','is'],['atleast','is at least'],['atmost','is at most'],['between','is between']],boolean:[['true','is true'],['false','is false']]};
const examples={arch:{name:'My archaeology supplies',join:'all',rules:[{field:'skills',op:'phrase',value:'archaeology'},{field:'qty',op:'between',value:'',low:'100',high:'1k'}]},prices:{name:'Stacks within my budget',join:'all',rules:[{field:'qty',op:'between',value:'',low:'100',high:'1k'},{field:'price',op:'between',value:'',low:'5k',high:'25k'}]},text:{name:'Pick an item category',join:'all',rules:[{field:'category',op:'phrase',value:''}]},selected:{name:'My archaeology supplies',join:'all',rules:[{field:'skills',op:'phrase',value:'archaeology'},{field:'category',op:'phrase',value:'archaeology'}]}};
let rules=structuredClone(examples.arch.rules),popup=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=s=>s.charAt(0).toUpperCase()+s.slice(1);
const quote=s=>'"'+s.replace(/[\\"]/g,'\\$&')+'"';
function number(s){const m=String(s??'').replace(/,/g,'').trim().match(/^(\d*\.?\d+)([kmb]?)$/i);if(!m)return null;const n=Number(m[1])*({'':1,k:1000,m:1e6,b:1e9}[m[2].toLowerCase()]);return Number.isInteger(n)&&n>=0&&n<=2147483647?n:null;}
function parts(r){const f=byKey[r.field];if(f.kind==='boolean')return [r.op==='true'];if(f.kind==='number'){const ns=(r.op==='between'?[r.low,r.high]:[r.value]).map(number);return ns.some(n=>n===null)||ns.length===2&&ns[0]>ns[1]?null:ns;}return r.value?.trim()&&/\w/.test(r.value)?[r.value.trim()]:null;}
function clause(r){const p=parts(r);if(!p)return null;const f=byKey[r.field];if(f.kind==='boolean')return r.field+':'+r.op;if(f.kind==='number')return r.field+':['+(r.op==='atmost'?'*':p[0])+' TO '+(r.op==='atleast'?'*':p[p.length-1])+']';if(r.op==='phrase')return r.field+':'+quote(p[0]);const terms=p[0].split(/\s+/).map(w=>r.field+':'+quote(w));return terms.length>1?'('+terms.join(' AND ')+')':terms[0];}
const pickable=r=>byKey[r.field].kind==='text'&&r.field!=='name'&&(CATALOG_DATA.values[r.field]||[]).length>0;
const isOpen=r=>r.pickerOpen??!r.value?.trim();
function update(){
 const clauses=rules.map(clause),complete=rules.length&&clauses.every(Boolean);
 $('code').hidden=!complete;$('code').textContent=complete?clauses.join($('join').value==='all'?' AND ':' OR '):'';
 $('save').disabled=!complete||!$('searchName').value.trim();
 document.querySelectorAll('#rules input[data-part]').forEach(el=>{
  const r=rules[Number(el.dataset.row)],invalid=byKey[r.field].kind==='number'&&el.value!==''&&(number(el.value)===null||r.op==='between'&&number(r.low)!==null&&number(r.high)!==null&&number(r.low)>number(r.high));
  el.setAttribute('aria-invalid',String(invalid));
 });
}
function input(i,part,value,placeholder,autocomplete=false){return '<input aria-label="Condition '+(i+1)+' '+part+'" data-row="'+i+'" data-part="'+part+'" value="'+esc(value)+'" placeholder="'+placeholder+'" autocomplete="off" spellcheck="false"'+(autocomplete?' role="combobox" aria-autocomplete="list" aria-controls="'+(pickable(rules[i])?'picker-'+i:'suggestions')+'" aria-expanded="false"':'')+'>';}
function render(){
 closeMenu();
 $('rules').innerHTML=rules.map((r,i)=>{
  const f=byKey[r.field],pick=pickable(r),skill=r.field==='skills';
  let value=f.kind==='boolean'?'':r.op==='between'?'<div class="range"><label><span>Low</span>'+input(i,'low',r.low,'e.g. 100')+'</label><label><span>High</span>'+input(i,'high',r.high,'e.g. 1k')+'</label></div>':'<div class="value-input">'+input(i,'value',r.value,f.kind==='number'?'e.g. 500 or 25k':pick?'Choose below or type…':'Type to find a value…',f.kind==='text')+(pick?'<button class="clear-value" data-clear="'+i+'" aria-label="Clear condition '+(i+1)+' value" title="Clear value"'+(!r.value?' hidden':'')+'>×</button>':'')+'</div>';
  const choices=skill?[['phrase','includes skill']]:operators[f.kind];
  return '<section class="rule" data-row="'+i+'" aria-label="Condition '+(i+1)+'"><div class="rule-head"><label class="cell"><select data-row="'+i+'" data-part="field" aria-label="Condition '+(i+1)+' field">'+defs.map(d=>'<option value="'+d.key+'"'+(r.field===d.key?' selected':'')+'>'+d.label+'</option>').join('')+'</select></label><label class="cell"><select data-row="'+i+'" data-part="op" aria-label="Condition '+(i+1)+' comparison">'+choices.map(o=>'<option value="'+o[0]+'"'+(r.op===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label><div class="cell value-cell'+(r.op==='between'?' range-cell':'')+'">'+value+'</div><button class="remove" data-remove="'+i+'" aria-label="Remove condition '+(i+1)+'">×</button></div>' +(pick?'<div class="picker" data-field="'+r.field+'" id="picker-'+i+'"'+(!isOpen(r)?' hidden':'')+'><div class="picker-grid" role="listbox" aria-label="Condition '+(i+1)+' choices"></div></div>':'')+'</section>';
 }).join('');
 rules.forEach((r,i)=>{if(pickable(r))refreshPicker(i);});update();
}
function refreshPicker(i){
 const r=rules[i],section=document.querySelector('.rule[data-row="'+i+'"]'),panel=$('picker-'+i);if(!panel)return;
 panel.hidden=!isOpen(r);section.querySelector('[data-clear]').hidden=!r.value;
 if(panel.hidden)return;
 const opts=options(i,r.pickerFilter||'');
 panel.querySelector('.picker-grid').innerHTML=opts.map((o,index)=>'<button class="skill" role="option" aria-selected="'+(r.value===o.value)+'" data-pick="'+i+'" data-pick-value="'+esc(o.value)+'" title="'+esc(o.value)+'"><span>'+esc(r.field==='skills'?pretty(o.value):o.value)+'</span></button>').join('')||'<span class="empty">No matches</span>';
}
function chooseValue(row,value){const r=rules[row];r.value=value;r.pickerOpen=false;r.pickerFilter='';const el=document.querySelector('input[data-row="'+row+'"][data-part="value"]');el.value=value;closeMenu();refreshPicker(row);update();}
function options(row,q){const r=rules[row],values=r.field==='name'?CATALOG_DATA.items.map(i=>i.name):CATALOG_DATA.values[r.field]||[];return [...new Set(values.map(String))].filter(v=>v.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.localeCompare(b)).map(value=>({value}));}
function openMenu(input){const row=Number(input.dataset.row);if(pickable(rules[row])&&!isOpen(rules[row]))return;popup={input,row,opts:options(row,input.value),active:0,inline:pickable(rules[row])};input.setAttribute('aria-expanded','true');paintMenu();}
function paintMenu(){if(!popup)return;const p=popup,m=$('suggestions');if(p.inline){m.hidden=true;const panel=$('picker-'+p.row);panel.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('highlighted',b.dataset.pickValue===p.opts[p.active]?.value));return;}m.hidden=false;m.innerHTML=(p.opts.length?p.opts.slice(0,100).map((o,i)=>'<button tabindex="-1" class="option" role="option" id="suggestion-'+i+'" aria-selected="'+(p.active===i)+'" data-option="'+i+'"><span>'+esc(o.value)+'</span></button>').join(''):'<div class="empty">No matches</div>');p.input.setAttribute('aria-activedescendant',p.opts.length?'suggestion-'+p.active:'');positionMenu();}
function positionMenu(){if(!popup)return;const w=document.querySelector('.window').getBoundingClientRect(),r=popup.input.getBoundingClientRect(),m=$('suggestions');m.style.width=Math.min(Math.max(r.width,250),w.width-34)+'px';m.style.left=Math.max(16,Math.min(r.left-w.left,w.width-parseFloat(m.style.width)-17))+'px';m.style.top=r.bottom-w.top+5+'px';}
function closeMenu(){if(popup){popup.input.setAttribute('aria-expanded','false');popup.input.removeAttribute('aria-activedescendant');}popup=null;$('suggestions').hidden=true;}
function accept(option){if(!popup)return;const p=popup;if(pickable(rules[p.row])){chooseValue(p.row,option.value);return;}rules[p.row].value=option.value;p.input.value=option.value;closeMenu();update();}
document.addEventListener('focusin',e=>{if(e.target.matches('#rules input[role=combobox]'))openMenu(e.target);else closeMenu();});
document.addEventListener('input',e=>{const el=e.target;
 if(!el.matches('#rules input'))return;const row=Number(el.dataset.row),r=rules[row];r[el.dataset.part]=el.value;
 if(pickable(r)){r.pickerOpen=true;r.pickerFilter=el.value;refreshPicker(row);}
 update();if(el.matches('[role=combobox]'))openMenu(el);
});
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('#rules select'))return;const r=rules[Number(el.dataset.row)];if(el.dataset.part==='field'){r.field=el.value;r.op=operators[byKey[r.field].kind][0][0];r.value='';r.low='';r.high='';delete r.pickerOpen;delete r.pickerFilter;}else r.op=el.value;render();});
document.addEventListener('keydown',e=>{if(!e.target.closest('.window'))return;if(e.key==='Tab'){e.preventDefault();if(!e.shiftKey&&popup&&e.target===popup.input&&popup.opts.length)accept(popup.opts[popup.active]);return;}if(!popup||e.target!==popup.input)return;if(e.key==='Escape'){e.preventDefault();if(popup.inline){rules[popup.row].pickerOpen=false;refreshPicker(popup.row);}closeMenu();return;}if((e.key==='ArrowDown'||e.key==='ArrowUp')&&popup.opts.length){e.preventDefault();popup.active=(popup.active+(e.key==='ArrowDown'?1:-1)+Math.min(100,popup.opts.length))%Math.min(100,popup.opts.length);paintMenu();(popup.inline?$('picker-'+popup.row).querySelector('.highlighted'):$('suggestions').querySelector('[aria-selected=true]'))?.scrollIntoView({block:'nearest'});return;}if(e.key==='Enter'){e.preventDefault();if(popup.opts.length)accept(popup.opts[popup.active]);else closeMenu();}});
$('suggestions').addEventListener('mousedown',e=>e.preventDefault());$('suggestions').onclick=e=>{const b=e.target.closest('[data-option]');if(b&&popup)accept(popup.opts[Number(b.dataset.option)]);};
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-pick]'))e.preventDefault();});
document.addEventListener('click',e=>{
 const pick=e.target.closest('[data-pick]');if(pick){chooseValue(Number(pick.dataset.pick),pick.dataset.pickValue);return;}
 const clear=e.target.closest('[data-clear]');if(clear){const row=Number(clear.dataset.clear);const r=rules[row];r.value='';r.pickerOpen=true;r.pickerFilter='';const section=clear.closest('.rule');section.querySelector('input[data-part="value"]').value='';closeMenu();refreshPicker(row);update();return;}
 const value=e.target.closest('input[data-part="value"]');if(value&&!value.value.trim()&&pickable(rules[Number(value.dataset.row)])){const row=Number(value.dataset.row);rules[row].pickerOpen=true;rules[row].pickerFilter='';refreshPicker(row);return;}
 const remove=e.target.closest('[data-remove]');if(remove){rules.splice(Number(remove.dataset.remove),1);render();return;}
 if(!e.target.closest('.menu')&&!e.target.matches('input[role=combobox]'))closeMenu();
});
$('add').onclick=()=>{rules.push({field:'name',op:'phrase',value:'',low:'',high:''});render();};
$('join').onchange=update;
$('searchName').oninput=update;
$('cancel').onclick=()=>{rules=structuredClone(examples.arch.rules);$('searchName').value=examples.arch.name;$('join').value='all';render();};
$('save').onclick=()=>{window.savedSearch={name:$('searchName').value.trim(),query:$('code').textContent};};
window.addEventListener('resize',positionMenu);render();
</script>
